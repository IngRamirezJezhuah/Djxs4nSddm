<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginSDDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Hachi+Maru+Pop&family=Permanent+Marker&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="js/reloj.js" defer></script>
    <script src="js/usermodel.js" defer></script>
    <script src="js/leerUser.js" defer></script>
    <script src="js/login.js" defer></script>
    <script>
        // Inicializar los datos del sistema al cargar
        window.addEventListener("DOMContentLoaded", () => {
            if (typeof sddm !== 'undefined') {
                cargarDatosSistema(); 
            }
        });
    </script>
</head>
<body>
    <div class="bg">
        <div class="login-box">
            <h1 class="bienvenida">お帰りなさいマスタ</h1>
            <div class="porfile" id="avatar-circulo"></div>
            <div id="reloj"></div>
            <div id="fecha"></div>
            <div class="input-box">
                <input type="Text" id="input_usuario" placeholder="Usuario" class="inputs">
                <input type="password" id="input_password" placeholder="Contraseña..." class="inputs">
                <button onclick="intentrarLogin()" class="btn">Login</button>
            </div>
        </div>
        <div class="icons-box">
            <button onclick="sddm.powerOff()" class="iconbtn"><img src="/img/apagar.png" alt="apagar" class="icons" ></button>
            <button onclick="sddm.hinbernate()" class="iconbtn"><image src="/img/hinbernar.png" class="icons"></button>
            <button onclick="sddm.reboot()" class="iconbtn"><image src="/img/reiniciar.png" class="icons"></button>
            <button onclick="sddm.suspend()" class="iconbtn"><image src="/img/suspender.png" class="icons"></image></button>
        </div>
    </div>
</body>
</html>
